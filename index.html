<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julian La Fortune — Human Rights & Child Advocate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --surface: #0b0b0b;
      --surface-elevated: #111111;
      --text: #ffffff;
      --text-secondary: #b8b8b8;
      --text-muted: #787878;
      --border: rgba(255, 255, 255, 0.14);
      --border-strong: rgba(255, 255, 255, 0.28);
      --accent-bg: #ffffff;
      --accent-text: #050505;
      --font-display: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: "Instrument Serif", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --font-pronoun: "Times New Roman", Times, Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
      color: var(--text);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Subtle monochrome architectural grid + film grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse at 50% 20%, #000 35%, rgba(0, 0, 0, 0.45) 85%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.035;
      background-image: radial-gradient(rgba(255, 255, 255, 0.85) 0.6px, transparent 0.6px);
      background-size: 3px 3px;
    }

    .page-shell {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* Top Navigation Bar — completely flush at top of browser */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      background: rgba(5, 5, 5, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0.95rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-mark-dot {
      width: 8px;
      height: 8px;
      background: var(--text);
      border-radius: 50%;
      display: inline-block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.15rem;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text);
      transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--text);
    }

    .btn-primary {
      background: var(--accent-bg);
      color: var(--accent-text);
      border-color: var(--accent-bg);
      font-weight: 500;
    }

    .btn-primary:hover {
      background: #e6e6e6;
      border-color: #e6e6e6;
      color: var(--accent-text);
    }

    /* Kinetic Ticker Banner */
    .ticker {
      width: 100%;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: tickerScroll 28s linear infinite;
    }

    .ticker:hover .ticker-track {
      animation-play-state: paused;
    }

    .ticker-group {
      display: flex;
      align-items: center;
      gap: 2.25rem;
      padding: 0.65rem 1.125rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .ticker-sep {
      color: var(--text-muted);
    }

    @keyframes tickerScroll {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }

    /* Hero Section */
    .hero {
      padding: 4.5rem 0 4rem;
      border-bottom: 1px solid var(--border);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.85fr);
      gap: 3rem;
      align-items: start;
    }

    .eyebrow-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text);
    }

    .hero-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(3.2rem, 7.2vw, 6.2rem);
      line-height: 0.96;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 1.4rem;
    }

    .hero-name-first,
    .hero-name-last-row {
      display: block;
    }

    .hero-name-last-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .pronouns-inline {
      font-family: var(--font-pronoun);
      font-style: italic;
      font-weight: 400;
      font-size: 1rem;
      letter-spacing: 0.01em;
      text-transform: none;
      line-height: 1.2;
      color: var(--text-secondary);
    }

    .hero-role {
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.01em;
      margin-bottom: 1.35rem;
    }

    .hero-mission {
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--text-secondary);
      max-width: 64ch;
      margin-bottom: 2.25rem;
    }

    .hero-cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
    }

    /* Profile Snapshot Card */
    .snapshot-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }

    .snapshot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .snapshot-item {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .snapshot-item:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .snapshot-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .snapshot-value {
      font-size: 0.96rem;
      color: var(--text);
      line-height: 1.5;
    }

    .snapshot-value a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border-strong);
      padding-bottom: 1px;
    }

    .snapshot-value a:hover {
      border-bottom-color: var(--text);
    }

    /* Sections */
    .section {
      padding: 4.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .section-index {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.55rem;
      display: block;
    }

    .section-title {
      font-size: clamp(1.9rem, 3.8vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.08;
      color: var(--text);
    }

    /* Filter Bar */
    .filter-bar {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding: 0.3rem;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .filter-btn:hover {
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent-bg);
      color: var(--accent-text);
      font-weight: 500;
    }

    /* Pillars Grid */
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.25rem;
    }

    .pillar-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
      cursor: pointer;
      transition: border-color 0.25s ease, transform 0.25s ease, background-color 0.25s ease;
      overflow: hidden;
    }

    .pillar-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        420px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.08),
        transparent 65%
      );
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .pillar-card:hover {
      border-color: var(--border-strong);
      background: var(--surface-elevated);
      transform: translateY(-3px);
    }

    .pillar-card:hover::before {
      opacity: 1;
    }

    .pillar-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .pillar-title {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-top: 0.85rem;
      margin-bottom: 0.65rem;
    }

    .pillar-summary {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    .pillar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
    }

    /* Legal & Recognition Section */
    .recognition-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      gap: 2rem;
      align-items: stretch;
    }

    .plaque {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      padding: 2.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.75rem;
    }

    .plaque-source {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .plaque-quote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(1.65rem, 3vw, 2.4rem);
      line-height: 1.25;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .plaque-attribution {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .plaque-judge {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .plaque-detail {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .affiliations-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .affiliation-card {
      padding-bottom: 1.35rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .affiliation-card:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .affiliation-tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: block;
      margin-bottom: 0.35rem;
    }

    .affiliation-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    .affiliation-desc {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Contact Section */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem;
    }

    .contact-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .contact-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      display: block;
    }

    .contact-value {
      font-size: clamp(1.3rem, 2.4vw, 1.85rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      word-break: break-word;
    }

    .contact-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    /* Footer */
    .footer {
      padding: 2.25rem 0;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    /* Scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-dialog {
      width: 100%;
      max-width: 600px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-strong);
      padding: 2rem;
      color: var(--text);
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .modal-close {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }

    .modal-close:hover {
      border-color: var(--text);
    }

    .modal-title {
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.85rem;
    }

    .modal-body {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 70;
      background: var(--accent-bg);
      color: var(--accent-text);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.75rem 1.15rem;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 980px) {
      .hero-grid,
      .pillars-grid,
      .recognition-layout,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .nav-links {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .container,
      .topbar-inner {
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }

      .hero {
        padding-top: 3rem;
        padding-bottom: 3rem;
      }

      .section {
        padding: 3.25rem 0;
      }

      .nav-actions .btn:first-child {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a href="#top" class="brand-mark">
          <span class="brand-mark-dot"></span>
          <span>JULIAN LA FORTUNE // ADVOCACY</span>
        </a>

        <nav aria-label="Primary Navigation">
          <ul class="nav-links">
            <li><a href="#mission">Mission</a></li>
            <li><a href="#pillars">Pillars</a></li>
            <li><a href="#recognition">Legal &amp; Recognition</a></li>
            <li><a href="#affiliations">Affiliations</a></l
