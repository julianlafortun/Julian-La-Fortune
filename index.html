<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Julian La Fortune — youth advocacy, human rights, public policy, and an interest in the law.">
  <title>Julian La Fortune — Youth Advocacy & Public Policy</title>

  <style>
    /* =========================================================
       JULIAN LA FORTUNE — OBSIDIAN
       Single-file portfolio | HTML + CSS + JavaScript
       ========================================================= */

    :root {
      color-scheme: dark;
      --black: #080808;
      --black-soft: #0d0d0d;
      --panel: #111111;
      --panel-raised: #151515;
      --white: #f4f4f1;
      --muted: #a2a2a0;
      --dim: #70706e;
      --line: rgba(255,255,255,.13);
      --line-strong: rgba(255,255,255,.23);
      --accent: #d8d8d2;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page-width: 1180px;
      --page-gutter: clamp(1.25rem, 5vw, 5rem);
      --ease: cubic-bezier(.2,.7,.2,1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
      background: var(--black);
    }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 78% 7%, rgba(255,255,255,.055), transparent 34rem),
        radial-gradient(ellipse at 12% 42%, rgba(255,255,255,.025), transparent 30rem),
        var(--black);
      color: var(--white);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    ::selection {
      color: var(--black);
      background: var(--white);
    }

    .skip-link {
      position: absolute;
      top: -5rem;
      left: 1rem;
      z-index: 1000;
      padding: .8rem 1rem;
      background: var(--white);
      color: var(--black);
    }

    .skip-link:focus {
      top: 1rem;
    }

    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 100;
      border-bottom: 1px solid transparent;
      background: rgba(8,8,8,.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: border-color .3s ease, background .3s ease;
    }

    .site-header.is-scrolled {
      border-color: var(--line);
      background: rgba(8,8,8,.92);
    }

    .nav-wrap {
      width: min(100%, var(--page-width));
      min-height: 76px;
      margin: 0 auto;
      padding: 0 var(--page-gutter);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .wordmark {
      display: inline-flex;
      flex-direction: column;
      gap: .05rem;
      line-height: 1.1;
      letter-spacing: .11em;
      text-transform: uppercase;
      font-size: .73rem;
      font-weight: 700;
    }

    .wordmark span:last-child {
      color: var(--dim);
      font-size: .58rem;
      font-weight: 500;
      letter-spacing: .22em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2.3vw, 2rem);
    }

    .nav-links a {
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: color .25s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--white);
    }

    .nav-contact {
      padding: .72rem 1rem;
      border: 1px solid var(--line-strong);
      color: var(--white) !important;
      transition: background .25s ease, color .25s ease;
    }

    .nav-contact:hover {
      color: var(--black) !important;
      background: var(--white);
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--white);
      cursor: pointer;
    }

    .menu-toggle span {
      display: block;
      width: 17px;
      height: 1px;
      margin: 5px auto;
      background: currentColor;
      transition: transform .25s ease;
    }

    main {
      overflow: clip;
    }

    .container {
      width: min(100%, var(--page-width));
      margin: 0 auto;
      padding-inline: var(--page-gutter);
    }

    .hero {
      min-height: min(920px, 100svh);
      min-height: max(720px, 100svh);
      display: flex;
      align-items: center;
      position: relative;
      padding-top: 110px;
      padding-bottom: 100px;
    }

    .hero::after {
      position: absolute;
      right: 7%;
      bottom: 12%;
      width: min(42vw, 540px);
      aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%;
      content: "";
      box-shadow:
        0 0 0 42px rgba(255,255,255,.012),
        0 0 0 84px rgba(255,255,255,.009),
        0 0 100px rgba(255,255,255,.035) inset;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 920px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: .85rem;
      margin: 0 0 2rem;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 34px;
      height: 1px;
      background: var(--muted);
      content: "";
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .hero h1 {
      max-width: 1000px;
      margin-bottom: 1.8rem;
      font-family: var(--serif);
      font-size: clamp(4rem, 10.5vw, 9.7rem);
      font-weight: 400;
      letter-spacing: -.075em;
      line-height: .91;
    }

    .hero h1 span {
      display: block;
      color: #888885;
      font-style: italic;
      font-weight: 400;
    }

    .hero-intro {
      max-width: 590px;
      margin-bottom: 2.5rem;
      color: #b5b5b1;
      font-size: clamp(1rem, 1.5vw, 1.2rem);
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .85rem;
    }

    .button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      padding: .85rem 1.2rem;
      border: 1px solid var(--line-strong);
      font-size: .7rem;
      font-weight: 650;
      letter-spacing: .13em;
      text-transform: uppercase;
      transition: transform .25s ease, background .25s ease, color .25s ease, border-color .25s ease;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    .button-primary {
      border-color: var(--white);
      background: var(--white);
      color: var(--black);
    }

    .button-primary:hover {
      background: transparent;
      color: var(--white);
    }

    .button-secondary {
      color: var(--white);
      background: transparent;
    }

    .button-secondary:hover {
      background: rgba(255,255,255,.08);
    }

    .hero-bottom {
      position: absolute;
      right: var(--page-gutter);
      bottom: 2.4rem;
      left: var(--page-gutter);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--dim);
      font-size: .63rem;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .scroll-cue {
      display: inline-flex;
      align-items: center;
      gap: .8rem;
    }

    .scroll-cue::before {
      width: 38px;
      height: 1px;
      background: var(--dim);
      content: "";
    }

    .section {
      position: relative;
      padding: clamp(6rem, 12vw, 11rem) 0;
      border-top: 1px solid var(--line);
    }

    .section-heading {
      display: grid;
      grid-template-columns: minmax(130px, .55fr) 1.45fr;
      gap: 2rem;
      margin-bottom: clamp(3rem, 7vw, 6rem);
    }

    .section-index {
      padding-top: .7rem;
      color: var(--dim);
      font-size: .67rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .section-title {
      max-width: 850px;
      margin-bottom: 0;
      font-family: var(--serif);
      font-size: clamp(2.8rem, 6.3vw, 6.1rem);
      font-weight: 400;
      letter-spacing: -.06em;
      line-height: .99;
    }

    .section-title em {
      color: #858582;
      font-weight: 400;
    }

    .about-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: clamp(3rem, 8vw, 8rem);
      align-items: start;
    }

    .about-lead {
      font-family: var(--serif);
      font-size: clamp(1.7rem, 3vw, 2.8rem);
      line-height: 1.25;
      letter-spacing: -.035em;
    }

    .about-copy {
      max-width: 620px;
      color: var(--muted);
      font-size: .98rem;
    }

    .about-copy p + p {
      margin-top: 1.25rem;
    }

    .principles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-top: 5rem;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .principle {
      min-height: 190px;
      padding: 1.7rem;
      background: var(--black);
    }

    .principle-number {
      display: block;
      margin-bottom: 2rem;
      color: var(--dim);
      font-size: .65rem;
      letter-spacing: .15em;
    }

    .principle h3 {
      margin-bottom: .55rem;
      font-family: var(--serif);
      font-size: 1.55rem;
      font-weight: 400;
    }

    .principle p {
      margin: 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .work-card {
      position: relative;
      min-height: 330px;
      padding: clamp(1.6rem, 3vw, 2.7rem);
      border: 1px solid var(--line);
      background:
        linear-gradient(145deg, rgba(255,255,255,.045), transparent 58%),
        var(--panel);
      overflow: hidden;
      transition: border-color .3s ease, transform .3s ease, background .3s ease;
    }

    .work-card:hover {
      transform: translateY(-5px);
      border-color: var(--line-strong);
      background:
        linear-gradient(145deg, rgba(255,255,255,.075), transparent 58%),
        var(--panel-raised);
    }

    .card-kicker {
      display: block;
      margin-bottom: 3.4rem;
      color: var(--dim);
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .work-card h3 {
      max-width: 470px;
      margin-bottom: 1rem;
      font-family: var(--serif);
      font-size: clamp(1.9rem, 3.2vw, 3rem);
      font-weight: 400;
      letter-spacing: -.04em;
      line-height: 1.05;
    }

    .work-card p {
      max-width: 520px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .card-mark {
      position: absolute;
      right: 1.7rem;
      bottom: 1.3rem;
      color: rgba(255,255,255,.15);
      font-family: var(--serif);
      font-size: 4.5rem;
      line-height: 1;
    }

    .collaboration-note {
      margin-top: 1.3rem;
      padding: 1.25rem 1.5rem;
      border-left: 1px solid var(--white);
      background: rgba(255,255,255,.035);
      color: var(--muted);
      font-size: .82rem;
    }

    .collaboration-note strong {
      color: var(--white);
      font-weight: 600;
    }

    .quote-section {
      padding: clamp(6rem, 13vw, 12rem) 0;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.07), transparent 60%),
        #0c0c0c;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .quote-wrap {
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
    }

    .quote-mark {
      display: block;
      margin-bottom: 1.5rem;
      color: #777773;
      font-family: var(--serif);
      font-size: 5rem;
      line-height: .6;
    }

    blockquote {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.2rem, 5vw, 4.7rem);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1.12;
    }

    .quote-attribution {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .15em;
      line-height: 1.9;
      text-transform: uppercase;
    }

    .quote-attribution strong {
      display: block;
      color: var(--white);
      font-weight: 600;
    }

    .quote-context {
      max-width: 590px;
      margin: 2rem auto 0;
      color: var(--dim);
      font-size: .82rem;
    }

    .law-card {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: clamp(2rem, 7vw, 7rem);
      align-items: center;
      padding: clamp(2rem, 5vw, 4rem);
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255,255,255,.055), transparent 70%), var(--panel);
    }

    .book-visual {
      position: relative;
      width: min(100%, 290px);
      aspect-ratio: .72;
      margin: 0 auto;
      padding: 1.5rem;
      border: 1px solid rgba(255,255,255,.3);
      background:
        linear-gradient(90deg, rgba(0,0,0,.65), transparent 14%),
        linear-gradient(145deg, #282828, #090909 70%);
      box-shadow: 18px 22px 45px rgba(0,0,0,.45), inset 1px 0 rgba(255,255,255,.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }

    .book-visual::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 11px;
      width: 1px;
      background: rgba(255,255,255,.18);
      content: "";
    }

    .book-small {
      color: #bdbdb7;
      font-family: var(--serif);
      font-size: .68rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .book-title {
      font-family: var(--serif);
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      line-height: .95;
      letter-spacing: -.04em;
    }

    .book-edition {
      color: #aaa;
      font-size: .58rem;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .law-copy h3 {
      margin-bottom: 1rem;
      font-family: var(--serif);
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 400;
      letter-spacing: -.05em;
      line-height: 1.05;
    }

    .law-copy p {
      max-width: 590px;
      color: var(--muted);
      font-size: .92rem;
    }

    .law-copy .small-note {
      margin-top: 1.5rem;
      color: var(--dim);
      font-size: .76rem;
    }

    .focus-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 3rem;
      border-top: 1px solid var(--line);
    }

    .focus-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.35rem 0;
      border-bottom: 1px solid var(--line);
    }

    .focus-item span:first-child {
      font-family: var(--serif);
      font-size: 1.35rem;
    }

    .focus-item span:last-child {
      color: var(--dim);
      font-size: .62rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .contact-section {
      padding-bottom: clamp(6rem, 12vw, 10rem);
    }

    .contact-panel {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 3rem;
      padding: clamp(2rem, 6vw, 5rem);
      border: 1px solid var(--line-strong);
      background:
        radial-gradient(ellipse at 100% 0%, rgba(255,255,255,.07), transparent 50%),
        var(--panel);
    }

    .contact-panel h2 {
      max-width: 620px;
      margin-bottom: 1.2rem;
      font-family: var(--serif);
      font-size: clamp(3rem, 6vw, 5.8rem);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: .98;
    }

    .contact-panel p {
      max-width: 520px;
      color: var(--muted);
      font-size: .9rem;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.5rem;
    }

    .contact-item {
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }

    .contact-label {
      display: block;
      margin-bottom: .55rem;
      color: var(--dim);
      font-size: .63rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .contact-email {
      display: inline-block;
      font-family: var(--serif);
      font-size: clamp(1.05rem, 2vw, 1.5rem);
      overflow-wrap: anywhere;
      transition: color .2s ease;
    }

    .contact-email:hover {
      color: #aaa;
    }

    .site-footer {
      padding: 2rem 0;
      border-top: 1px solid var(--line);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .footer-copy,
    .footer-top {
      color: var(--dim);
      font-size: .65rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .footer-top:hover {
      color: var(--white);
    }

    /* Scroll reveal: content remains visible if JavaScript is unavailable. */
    .reveal {
      opacity: 1;
      transform: none;
    }

    .js-ready .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition:
        opacity .9s var(--ease),
        transform .9s var(--ease);
      will-change: opacity, transform;
    }

    .js-ready .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .js-ready .reveal-delay-1 {
      transition-delay: .12s;
    }

    .js-ready .reveal-delay-2 {
      transition-delay: .22s;
    }

    .js-ready .reveal-delay-3 {
      transition-delay: .32s;
    }

    .progress-track {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 200;
      width: 100%;
      height: 2px;
      background: transparent;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--white);
      transform-origin: left;
    }

        display: none;
        align-items: stretch;
        flex-direction: column;
        gap: 0;
        padding: .5rem var(--page-gutter) 1.2rem;
        border-bottom: 1px solid var(--line);
        background: rgba(8,8,8,.98);
      }

      .nav-links.is-open {
        display: flex;
      }

      .nav-links a {
        padding: 1rem 0;
        border-bottom: 1px solid var(--line);
      }

      .nav-contact {
        margin-top: .7rem;
        padding: .9rem 1rem !important;
        text-align: center;
      }

      .hero {
        min-height: 790px;

      }

      .principles {
        grid-template-columns: 1fr;
      }

      .principle {
        min-height: 150px;
      }

      .principle-number {
        margin-bottom: 1rem;
      }
