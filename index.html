<!DOCTYPE html>
<html lang="en" id="top">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Julian La Fortune — Human Rights & Child Advocate." />
<title>Julian La Fortune — Human Rights & Child Advocate</title>
<link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)" />
<link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin />
<link href="[https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap)" rel="stylesheet" />
<style>
:root {
--bg: #050505;
--surface: #0b0b0b;
--surface-elevated: #111111;
--text: #ffffff;
--text-secondary: #bcbcbc;
--text-muted: #828282;
--border: rgba(255, 255, 255, 0.14);
--border-strong: rgba(255, 255, 255, 0.28);
--accent-bg: #ffffff;
--accent-text: #050505;
--focus-ring: #ffffff;
--font-display: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
--font-serif: "Instrument Serif", Georgia, serif;
--font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
--radius-pill: 999px;
--radius-sm: 2px;
--ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}
*,
*::before,
*::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}
html {
scroll-behavior: smooth;
scroll-padding-top: 5.5rem;
background-color: var(--bg);
color: var(--text);
font-size: 16px;
}
body {
margin: 0;
padding: 0;
min-height: 100vh;
background-color: var(--bg);
color: var(--text);
font-family: var(--font-display);
line-height: 1.65;
overflow-x: hidden;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
position: relative;
}
:focus-visible {
outline: 2px solid var(--focus-ring);
outline-offset: 3px;
}
.skip-link {
position: fixed;
top: -100px;
left: 1rem;
z-index: 100;
background: var(--accent-bg);
color: var(--accent-text);
padding: 0.65rem 1.1rem;
font-family: var(--font-mono);
font-size: 0.75rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.1em;
text-decoration: none;
transition: top 0.18s ease;
}
.skip-link:focus {
top: 1rem;
}
/* Subtle monochrome architectural grid + grain */
.bg-grid {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 0;
background-image:
linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
background-size: 64px 64px;
mask-image: radial-gradient(ellipse at 50% 18%, #000 32%, rgba(0, 0, 0, 0.42) 85%);
-webkit-mask-image: radial-gradient(ellipse at 50% 18%, #000 32%, rgba(0, 0, 0, 0.42) 85%);
}
.bg-grain {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 1;
opacity: 0.035;
background-image: radial-gradient(rgba(255, 255, 255, 0.9) 0.6px, transparent 0.6px);
background-size: 3px 3px;
}
.page-shell {
position: relative;
z-index: 2;
width: 100%;
min-height: 100vh;
display: flex;
flex-direction: column;
}
main {
flex: 1 0 auto;
}
.container {
width: 100%;
max-width: 1240px;
margin: 0 auto;
padding: 0 2rem;
}
/* Top Navigation Bar */
.topbar {
position: sticky;
top: 0;
z-index: 40;
width: 100%;
background: rgba(5, 5, 5, 0.92);
backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);
border-bottom: 1px solid var(--border);
}
.topbar-inner {
max-width: 1240px;
margin: 0 auto;
padding: 0.95rem 2rem;
display: flex;
align-items: center;
justify-content: space-between;
gap: 1.5rem;
}
.brand-mark {
display: inline-flex;
align-items: center;
gap: 0.7rem;
text-decoration: none;
color: var(--text);
font-family: var(--font-mono);
font-size: 0.78rem;
letter-spacing: 0.14em;
text-transform: uppercase;
white-space: nowrap;
flex-shrink: 0;
}
.brand-mark-dot {
width: 8px;
height: 8px;
background: var(--text);
border-radius: 50%;
display: inline-block;
flex-shrink: 0;
}
.nav-links {
display: flex;
align-items: center;
gap: 1.5rem;
list-style: none;
}
.nav-links a {
color: var(--text-secondary);
text-decoration: none;
font-family: var(--font-mono);
font-size: 0.72rem;
letter-spacing: 0.12em;
text-transform: uppercase;
padding: 0.25rem 0;
border-bottom: 1px solid transparent;
transition: color 0.2s ease, border-color 0.2s ease;
white-space: nowrap;
}
.nav-links a:hover {
color: var(--text);
border-bottom-color: var(--text);
}
.nav-actions {
display: flex;
align-items: center;
gap: 0.65rem;
flex-shrink: 0;
}
.mobile-toggle {
display: none;
background: transparent;
border: 1px solid var(--border-strong);
color: var(--text);
font-family: var(--font-mono);
font-size: 0.72rem;
letter-spacing: 0.12em;
text-transform: uppercase;
padding: 0.55rem 0.9rem;
border-radius: var(--radius-pill);
cursor: pointer;
}
.mobile-drawer {
display: none;
border-top: 1px solid var(--border);
background: var(--surface);
padding: 1.25rem 2rem 1.75rem;
}
.mobile-drawer.open {
display: block;
}
.mobile-drawer-links {
list-style: none;
display: flex;
flex-direction: column;
gap: 0.85rem;
margin-bottom: 1.25rem;
}
.mobile-drawer-links a {
color: var(--text);
text-decoration: none;
font-family: var(--font-mono);
font-size: 0.8rem;
letter-spacing: 0.12em;
text-transform: uppercase;
display: block;
padding: 0.25rem 0;
}
.mobile-drawer-actions {
display: flex;
flex-wrap: wrap;
gap: 0.65rem;
}
/* Buttons */
.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 0.5rem;
padding: 0.68rem 1.2rem;
border-radius: var(--radius-pill);
font-family: var(--font-mono);
font-size: 0.74rem;
letter-spacing: 0.1em;
text-transform: uppercase;
text-decoration: none;
cursor: pointer;
border: 1px solid var(--border-strong);
background: transparent;
color: var(--text);
transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
white-space: nowrap;
line-height: 1;
}
.btn:hover {
background: rgba(255, 255, 255, 0.09);
border-color: var(--text);
}
.btn:active {
transform: translateY(1px);
}
.btn-primary {
background: var(--accent-bg);
color: var(--accent-text);
border-color: var(--accent-bg);
font-weight: 600;
}
.btn-primary:hover {
background: #e6e6e6;
border-color: #e6e6e6;
color: var(--accent-text);
}
.btn-sm {
padding: 0.52rem 0.95rem;
font-size: 0.69rem;
}
/* Kinetic Ticker Banner */
.ticker {
width: 100%;
overflow: hidden;
border-bottom: 1px solid var(--border);
background: var(--surface);
}
.ticker-track {
display: flex;
width: max-content;
animation: tickerScroll 34s linear infinite;
will-change: transform;
}
.ticker:hover .ticker-track,
.ticker:focus-within .ticker-track {
animation-play-state: paused;
}
.ticker-group {
display: flex;
align-items: center;
gap: 2.25rem;
padding: 0.68rem 1.125rem;
font-family: var(--font-mono);
font-size: 0.72rem;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--text-secondary);
white-space: nowrap;
}
.ticker-sep {
color: var(--text-muted);
}
@keyframes tickerScroll {
0% { transform: translate3d(0, 0, 0); }
100% { transform: translate3d(-50%, 0, 0); }
}
/* Hero Section */
.hero {
padding: 4.5rem 0 4rem;
border-bottom: 1px solid var(--border);
}
.hero-grid {
display: grid;
grid-template-columns: minmax(0, 1.45fr) minmax(310px, 0.85fr);
gap: 3rem;
align-items: start;
}
.eyebrow-row {
display: flex;
flex-wrap: wrap;
align-items: center;
justify-content: space-between;
gap: 1rem;
margin-bottom: 1.75rem;
font-family: var(--font-mono);
font-size: 0.74rem;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--text-secondary);
}
.status-indicator {
display: inline-flex;
align-items: center;
gap: 0.5rem;
}
.status-dot {
width: 7px;
height: 7px;
border-radius: 50%;
background: var(--text);
display: inline-block;
}
.hero-name {
font-family: var(--font-display);
font-weight: 700;
font-size: clamp(3.1rem, 7.2vw, 6.1rem);
line-height: 0.96;
letter-spacing: -0.04em;
text-transform: uppercase;
color: var(--text);
margin-bottom: 1.4rem;
}
.hero-name-line {
display: block;
}
.hero-role {
font-size: clamp(1.12rem, 2vw, 1.45rem);
font-weight: 500;
color: var(--text);
letter-spacing: -0.01em;
margin-bottom: 1.25rem;
}
.hero-mission {
font-size: 1.04rem;
line-height: 1.75;
color: var(--text-secondary);
max-width: 65ch;
margin-bottom: 1rem;
}
.hero-mission + .hero-mission {
margin-bottom: 2.1rem;
}
.hero-cta-group {
display: flex;
flex-wrap: wrap;
gap: 0.85rem;
}
/* Profile Snapshot Card */
.snapshot-card {
background: var(--surface);
border: 1px solid var(--border);
padding: 1.75rem;
display: flex;
flex-direction: column;
gap: 1.25rem;
}
.snapshot-header {
display: flex;
align-items: center;
justify-content: space-between;
padding-bottom: 1rem;
border-bottom: 1px solid var(--border);
font-family: var(--font-mono);
font-size: 0.72rem;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--text-secondary);
}
.snapshot-item {
display: flex;
flex-direction: column;
gap: 0.3rem;
padding-bottom: 0.95rem;
border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.snapshot-item:last-child {
padding-bottom: 0;
border-bottom: none;
}
.snapshot-label {
font-family: var(--font-mono);
font-size: 0.68rem;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--text-muted);
}
.snapshot-value {
font-size: 0.95rem;
color: var(--text);
line-height: 1.5;
}
.snapshot-value a {
color: var(--text);
text-decoration: none;
border-bottom: 1px solid var(--border-strong);
padding-bottom: 1px;
}
.snapshot-value a:hover {
border-bottom-color: var(--text);
}
/* Sections */
.section {
padding: 4.75rem 0;
border-bottom: 1px solid var(--border);
}
.section-header {
display: flex;
flex-wrap: wrap;
align-items: flex-end;
justify-content: space-between;
gap: 1.5rem;
margin-bottom: 2.5rem;
}
.section-index {
font-family: var(--font-mono);
font-size: 0.74rem;
letter-spacing: 0.16em;
text-transform: uppercase;
color: var(--text-muted);
margin-bottom: 0.55rem;
display: block;
}
.section-title {
font-size: clamp(1.9rem, 3.8vw, 3rem);
font-weight: 600;
letter-spacing: -0.03em;
line-height: 1.08;
color: var(--text);
}
.section-lead {
max-width: 68ch;
color: var(--text-secondary);
font-size: 1rem;
line-height: 1.72;
margin-bottom: 2.25rem;
}
/* Mission Two-Column Breakdown */
.mission-grid {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 1.5rem;
}
.mission-panel {
background: var(--surface);
border: 1px solid var(--border);
padding: 2rem;
display: flex;
flex-direction: column;
gap: 0.9rem;
}
.mission-panel-tag {
font-family: var(--font-mono);
font-size: 0.7rem;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--text-muted);
}
.mission-panel-title {
font-size: 1.3rem;
font-weight: 600;
letter-spacing: -0.02em;
color: var(--text);
}
.mission-panel p {
color: var(--text-secondary);
font-size: 0.96rem;
line-height: 1.7;
}
/* Filter Bar */
.filter-bar {
display: inline-flex;
flex-wrap: wrap;
gap: 0.4rem;
padding: 0.3rem;
border: 1px solid var(--border);
background: var(--surface);
}
.filter-btn {
background: transparent;
border: 1px solid transparent;
color: var(--text-secondary);
font-family: var(--font-mono);
font-size: 0.7rem;
letter-spacing: 0.12em;
text-transform: uppercase;
padding: 0.5rem 0.9rem;
cursor: pointer;
transition: background-color 0.2s ease, color 0.2s ease;
}
.filter-btn:hover {
color: var(--text);
}
.filter-btn.active {
background: var(--accent-bg);
color: var(--accent-text);
font-weight: 600;
}
/* Pillars Grid */
.pillars-grid {
display: grid;
grid-template-columns: repeat(3, minmax(0, 1fr));
gap: 1.25rem;
}
.pillar-card {
position: relative;
background: var(--surface);
border: 1px solid var(--border);
padding: 1.75rem;
display: flex;
flex-direction: column;
justify-content: space-between;
gap: 1.5rem;
cursor: pointer;
transition: border-color 0.25s ease, transform 0.25s ease, background-color 0.25s ease;
overflow: hidden;
text-align: left;
}
.pillar-card.is-hidden {
display: none;
}
.pillar-card::before {
content: "";
position: absolute;
inset: 0;
pointer-events: none;
background: radial-gradient(
420px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
rgba(255, 255, 255, 0.08),
transparent 65%
);
opacity: 0;
transition: opacity 0.25s ease;
}
.pillar-card:hover,
.pillar-card:focus-within {
border-color: var(--border-strong);
background: var(--surface-elevated);
transform: translateY(-3px);
}
.pillar-card:hover::before {
opacity: 1;
}
.pillar-meta {
display: flex;
align-items: center;
justify-content: space-between;
gap: 0.75rem;
font-family: var(--font-mono);
font-size: 0.7rem;
letter-spacing: 0.13em;
text-transform: uppercase;
color: var(--text-muted);
}
.pillar-title {
font-size: 1.32rem;
font-weight: 600;
letter-spacing: -0.02em;
color: var(--text);
margin-top: 0.85rem;
margin-bottom: 0.65rem;
}
.pillar-summary {
font-size: 0.94rem;
color: var(--text-secondary);
line-height: 1.65;
}
.pillar-deliverables {
margin-top: 1rem;
padding-left: 1.1rem;
color: var(--text-secondary);
font-size: 0.88rem;
line-height: 1.55;
}
.pillar-deliverables li + li {
margin-top: 0.3rem;
}
.pillar-footer {
display: flex;
align-items: center;
justify-content: space-between;
padding-top: 1rem;
border-top: 1px solid rgba(255, 255, 255, 0.08);
font-family: var(--font-mono);
font-size: 0.72rem;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(--text);
}
/* Methodology & Table Section */
.methodology-grid {
display: grid;
grid-template-columns: repeat(4, minmax(0, 1fr));
gap: 1.25rem;
margin-bottom: 2.5rem;
}
.step-card {
background: var(--surface);
border: 1px solid var(--border);
padding: 1.6rem;
display: flex;
flex-direction: column;
gap: 0.75rem;
}
.step-num {
font-family: var(--font-mono);
font-size: 0.72rem;
letter-spacing: 0.16em;
text-transform: uppercase;
color: var(--text-muted);
}
.step-title {
font-size: 1.15rem;
font-weight: 600;
color: var(--text);
letter-spacing: -0.015em;
}
.step-desc {
font-size: 0.92rem;
color: var(--text-secondary);
line-height: 1.62;
}
.data-table-wrap {
width: 100%;
overflow-x: auto;
background: var(--surface);
border: 1px solid var(--border);
}
table.ledger-table {
width: 100%;
border-collapse: collapse;
text-align: left;
min-width: 680px;
}
.ledger-table th,
.ledger-table td {
padding: 1rem 1.25rem;
border-bottom: 1px solid rgba(255, 255, 255, 0.08);
vertical-align: top;
}
.ledger-table th {
font-family: var(--font-mono);
font-size: 0.7rem;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--text-muted);
background: var(--surface-elevated);
border-bottom: 1px solid var(--border);
}
.ledger-table td {
font-size: 0.93rem;
color: var(--text-secondary);
line-height: 1.55;
}
.ledger-table td strong {
color: var(--text);
font-weight: 600;
}
.ledger-table tbody tr:last-child td {
border-bottom: none;
}
/* Legal & Recognition Section */
.recognition-layout {
display: grid;
grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
gap: 2rem;
align-items: stretch;
}
.plaque {
background: var(--surface);
border: 1px solid var(--border-strong);
padding: 2.25rem;
display: flex;
flex-direction: column;
justify-content: space-between;
gap: 1.75rem;
}
.plaque-source {
font-family: var(--font-mono);
font-size: 0.72rem;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(--text-muted);
padding-bottom: 1rem;
border-bottom: 1px solid var(--border);
}
.plaque-quote {
font-family: var(--font-serif);
font-style: italic;
font-size: clamp(1.65rem, 3vw, 2.35rem);
line-height: 1.25;
color: var(--text);
letter-spacing: -0.01em;
}
.plaque-attribution {
display: flex;
flex-direction: column;
gap: 0.25rem;
padding-top: 1.25rem;
border-top: 1px solid var(--border);
}
.plaque-judge {
font-size: 1rem;
font-weight: 600;
color: var(--text);
}
.plaque-detail {
font-family: var(--font-mono);
font-size: 0.74rem;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(--text-secondary);
}
.affiliations-panel {
background: var(--surface);
border: 1px solid var(--border);
padding: 2.25rem;
display: flex;
flex-direction: column;
justify-content: space-between;
gap: 1.5rem;
